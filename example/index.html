<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>viro-web-renderer — example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1f; }
      #wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
      #viroCanvas { width: 90vw; max-width: 800px; aspect-ratio: 4 / 3; display: block; background: #000; touch-action: none; }
      #status { font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #9aa; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="viroCanvas"></canvas>
      <div id="status">loading…</div>
    </div>

    <!-- Uses the built package API (dist/). Serve the package root over http(s):
           cd .. && python3 -m http.server 8080
           open http://localhost:8080/example/ -->
    <script type="module">
      import { ViroWebRenderer, ViroLightingModel } from "../dist/index.js";

      const status = document.getElementById("status");
      try {
        const renderer = await ViroWebRenderer.create({
          canvas: document.getElementById("viroCanvas"),
        });

        // Build a cube entirely through the handle-based scene C API — exercises
        // node/geometry/material creation, materials, and parenting end-to-end.
        const s = renderer.scene;
        const root = s.getRootNode();

        const material = s.createMaterial();
        s.setMaterialDiffuseColor(material, 0.2, 0.6, 1.0, 1.0);
        s.setMaterialLightingModel(material, ViroLightingModel.Blinn);

        const box = s.createBox(2, 2, 2);
        s.setGeometryMaterial(box, material);

        const node = s.createNode();
        s.setNodeGeometry(node, box);
        s.setNodePosition(node, 0, 0, -5);
        s.addChildNode(root, node);

        // Spin the cube from JS to prove per-frame C API updates work.
        let angle = 0;
        setInterval(() => {
          angle += 0.02;
          s.setNodeRotation(node, 0, angle, 0);
        }, 16);

        status.textContent = "rendering (cube built via C API)";
        window.addEventListener("resize", () => renderer.resize());
      } catch (err) {
        status.textContent = "failed: " + err;
        console.error(err);
      }
    </script>
  </body>
</html>
